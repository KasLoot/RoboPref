[project]
name = "robopref"
version = "0.1.0"
description = "Consent-aware semantic preference memory and HRI orchestration for VLA robots"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.0.0",
    "ollama>=0.6.2",
    "pillow>=12.3.0",
    "tqdm>=4.69.0",
]

[project.optional-dependencies]
simulation = [
    "mujoco>=3.3.7",
    "numpy>=2.0",
]

[project.scripts]
robopref-benchmark = "simulation.benchmark.__main__:main"
