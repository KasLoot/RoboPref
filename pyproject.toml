[project]
name = "robopref"
version = "2.0.0"
description = "Preference-aware robotic task orchestration"
readme = "README.md"
authors = [
    { name = "yuxin", email = "steven.liu.yuxin@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6",
    "ipython>=9.15.0",
    "langchain>=1.3.14",
    "langchain-core>=1.5.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "opencv-python>=4.11.0.86,<5",
    "sentence-transformers>=5.6.1",
    "termcolor>=3.3.0",
]

[project.scripts]
prefmem = "prefmem.cli:main"
stream_camera = "prefmem.stream_camera:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-name = "prefmem"
