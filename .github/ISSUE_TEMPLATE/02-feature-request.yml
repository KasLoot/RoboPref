name: Feature request
description: Propose a new feature or improvement
title: "[Feature]: "
labels:
  - enhancement
  - triage

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement.
        Please provide enough information for the team to evaluate it.

  - type: input
    id: summary
    attributes:
      label: Feature summary
      description: Give the feature a short, clear description.
      placeholder: Add passwordless login
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem would this feature solve?
      placeholder: Describe the current limitation and who it affects.
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe how you think the feature should work.
      placeholder: Explain the expected user experience or technical behavior.
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: Affected area
      description: Which part of the system would this affect?
      options:
        - Frontend
        - Backend
        - API
        - Database
        - Infrastructure
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: What must be true for this feature to be considered complete?
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds.
    validations:
      required: false

  - type: upload
    id: attachments
    attributes:
      label: Designs or supporting files
      description: Upload mockups, screenshots, diagrams, or other relevant files.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for an existing issue describing this feature.
          required: true
        - label: This request describes one coherent feature.
          required: true