name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Clearly describe what went wrong.
      placeholder: Tell us what happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the problem.
      placeholder: |
        1. Go to...
        2. Click...
        3. Enter...
        4. See the error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: device-type
    attributes:
      label: Device type
      options:
        - Desktop
        - Mobile phone
        - Tablet
        - Server
        - Other
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: "Example: Windows 11, macOS 15, Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Example: Chrome 140"
    validations:
      required: false

  - type: input
    id: application-version
    attributes:
      label: Application version
      placeholder: "Example: 2.4.1"
    validations:
      required: false

  - type: upload
    id: attachments
    attributes:
      label: Screenshots, logs, or recordings
      description: Add files that help demonstrate the problem.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other relevant information.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for an existing issue describing this problem.
          required: true
        - label: I included enough information to reproduce the problem.
          required: true