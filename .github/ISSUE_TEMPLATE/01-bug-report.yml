name: Bug report
description: Create a report to help us improve

body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to...
        2. Click on...
        3. Scroll down to...
        4. See error...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp"

  - type: input
    id: desktop
    attributes:
      label: Desktop
      description: Provide the OS, browser, and version.
      placeholder: "Example: Windows 11, Chrome 140"
    validations:
      required: false

  - type: input
    id: smartphone
    attributes:
      label: Smartphone
      description: Provide the device, OS, browser, and version.
      placeholder: "Example: iPhone 16, iOS 19, Safari"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false